name: scrape-alemana-temp

on:
  push:
    branches:
      - tmp-alemana-hospitalizacion-20260711
    paths:
      - "scrape_alemana.py"
      - ".github/workflows/scrape_alemana.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scrape portal
        run: python scrape_alemana.py
      - name: Upload scrape artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alemana-scrape
          path: out/
          if-no-files-found: warn
      - name: Commit scrape output to temporary branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A out/
          if git diff --cached --quiet; then
            echo "No scrape output to commit"
            exit 0
          fi
          git commit -m "Temporary Clínica Alemana scrape output [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
